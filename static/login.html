<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>浏览器登录抖音 · 私信工作台</title><meta name="login-token" content="__LOGIN_TOKEN__"><script defer src="/login.js"></script><style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#243f32;background:#f2f5f0}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:460px;max-width:100%;background:#fff;border:1px solid #e0e8df;border-radius:20px;box-shadow:0 20px 70px #2647320b;padding:36px 40px;text-align:center}.brand{background:#173c2e;color:#fff;border-radius:12px;width:48px;height:48px;display:grid;place-items:center;font-weight:800;font-size:26px;margin:auto}.eyebrow{font-size:9px;letter-spacing:2px;color:#697e69;margin:22px 0 10px}h1{font-size:25px;margin:0 0 12px;letter-spacing:-.7px}.subtitle{font-size:12px;line-height:1.9;color:#657660;margin:0}.qr-frame{width:256px;height:256px;max-width:100%;margin:26px auto 20px;border:1px solid #e2eadd;border-radius:14px;background:#fafcf9;display:grid;place-items:center;padding:12px;position:relative}#qr{width:100%;height:100%;object-fit:contain}#placeholder{color:#74886d;font-size:12px;line-height:2;padding:15px}.spinner{display:block;margin:0 auto 14px;width:25px;height:25px;border:2px solid #dce8d8;border-top-color:#397956;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#status{padding:13px;border-radius:8px;background:#eef5eb;font-size:12px;line-height:1.9;color:#45643b;overflow-wrap:anywhere}#status.error{color:#953d29;background:#fff0e9}#status.success{color:#24623d;background:#e7f6e9}.steps{text-align:left;margin:24px 0;padding:0;list-style:none;counter-reset:step}.steps li{font-size:12px;line-height:1.9;margin:9px 0;color:#65755f;counter-increment:step}.steps li:before{content:counter(step);display:inline-grid;place-items:center;background:#eff4eb;color:#507543;border-radius:50%;width:20px;height:20px;margin-right:10px;font-size:10px}.back{display:block;padding:12px;background:#1a7157;border-radius:8px;color:#fff;text-decoration:none;font-size:12px}.note{font-size:10px;line-height:1.8;color:#6e7b65;margin:18px 0 0}[hidden]{display:none!important}a:focus-visible{outline:3px solid #8eb895;outline-offset:4px}@media(max-width:480px){.card{padding:28px 22px}body{padding:16px}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}
.actions{display:flex;gap:10px;justify-content:center;margin:16px 0}.actions button{padding:10px 15px;border:1px solid #a8c6b5;border-radius:8px;background:#f0f6ef;color:#254e3b;cursor:pointer}#status.verification_required{color:#825319;background:#fff5df}</style></head><body><main class="card"><div class="brand" aria-hidden="true">D·</div><p class="eyebrow">DOUYIN / ACCOUNT CONNECTION</p><h1>连接你的抖音账号</h1><p class="subtitle">在新打开的抖音官方窗口登录，凭证保存在本机。<br>此页面不会发送私信。</p><div class="qr-frame"><img id="qr" alt="使用抖音 App 扫描此登录二维码" hidden><div id="placeholder"><span class="spinner" aria-hidden="true"></span><span id="placeholder-text">正在打开官方登录窗口</span></div></div><div id="status" role="status" aria-live="polite">正在初始化登录，请稍候</div><ol class="steps"><li>在新打开的 Edge / Chrome 窗口点击抖音“登录”。</li><li>使用手机扫码；如提示身份验证，请在官方页面完成。</li><li>本页显示凭证已保存后，返回客服面板连接账号。</li></ol><div class="actions"><button id="restart" type="button" hidden>重新打开官方登录</button><button id="cancel" type="button">取消登录</button></div><a class="back" href="http://127.0.0.1:8765/">返回客服面板 ↗</a><p class="note">请保持登录脚本窗口开启。<br>验证码和身份验证仅在抖音官方页面填写。</p></main></body></html>
